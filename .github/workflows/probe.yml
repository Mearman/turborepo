name: probe
on: push
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    name: ${{ matrix.runner }} lint and test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-zig
      - uses: ./.github/actions/setup-capnproto
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: pnpm/action-setup@v4
        with:
          version: 12.0.0
      - name: Toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc -V
          zig version
      - name: cargo nextest (turbo.json command)
        run: cargo nextest run --workspace --exclude turborepo-lsp --exclude turborepo-schema-gen --exclude turborepo-napi --no-fail-fast --status-level slow --final-status-level fail
