name: probe
on: push
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15]
        ref: [fix-branch]
    name: ${{ matrix.runner }} zig 0.16 crash report
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-zig
      - uses: ./.github/actions/setup-capnproto
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: pnpm/action-setup@v4
        with:
          version: 12.0.0
      - name: Toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc -V
          zig version
      - name: Ghostty-facing tests
        run: |
          RUST_BACKTRACE=1 cargo nextest run -p turbo --test tui_test --no-fail-fast -E 'test(renders_tasks_and_navigates_between_their_output)' --no-capture || true
          for f in "$TMPDIR"/report-*.toml; do echo "== $f"; cat "$f"; done
