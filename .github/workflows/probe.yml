name: probe
on: push
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Zig 0.15.2
        run: |
          curl -fsSL https://ziglang.org/download/0.15.2/zig-aarch64-macos-0.15.2.tar.xz | tar -xJ
          echo "$PWD/zig-aarch64-macos-0.15.2" >> "$GITHUB_PATH"
      - name: Toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc -V
          zig version
      - name: Build libghostty-vt-sys
        run: cargo build -p libghostty-vt-sys
