name: probe
on: push
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    name: ${{ matrix.runner }} fixed build.rs
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-zig
      - uses: ./.github/actions/setup-capnproto
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: pnpm/action-setup@v4
        with:
          version: 12.0.0
      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc -V
          zig version
      - name: Exported libc symbols in the static library
        run: |
          cargo build -p libghostty-vt-sys
          for f in target/debug/build/libghostty-vt-sys-*/out/ghostty-install/lib/libghostty-vt.a; do
            echo "== $f"
            nm -gUA "$f" | grep -E " T _(memset|memcpy|memmove|memcmp|bcmp)$" || echo "none exported"
          done
      - name: tui_test
        run: cargo nextest run -p turbo --test tui_test --no-fail-fast
