name: probe
on: push
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-15, macos-26]
    name: ${{ matrix.runner }} zig 0.16 ghostty f2a7652
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0
      - name: Pin ghostty
        shell: bash
        run: |
          perl -pi -e 's/^const GHOSTTY_COMMIT: &str = ".*";/const GHOSTTY_COMMIT: &str = "f2a7652abab5d03f846f3150f9cc1b2dc23bb3dd";/' crates/libghostty-vt-sys/build.rs
          grep -n '^const GHOSTTY_COMMIT' crates/libghostty-vt-sys/build.rs
      - name: Toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc -V
          zig version
      - name: Build libghostty-vt-sys
        run: cargo build -p libghostty-vt-sys
      - name: Test the Rust bindings user
        run: cargo test -p turborepo-ghostty
