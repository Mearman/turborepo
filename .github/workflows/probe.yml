name: probe
on: push
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        variant: [as-is, localize-all-members]
    name: macos-15 ${{ matrix.variant }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-zig
      - uses: ./.github/actions/setup-capnproto
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: pnpm/action-setup@v4
        with:
          version: 12.0.0
      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc -V
          zig version
      - name: Patched Ghostty checkout
        if: matrix.variant == 'localize-all-members'
        run: |
          git clone --quiet https://github.com/ghostty-org/ghostty.git "$RUNNER_TEMP/ghostty"
          git -C "$RUNNER_TEMP/ghostty" checkout --quiet f2a7652abab5d03f846f3150f9cc1b2dc23bb3dd
          python3 - "$RUNNER_TEMP/ghostty/src/build/libsystem_override.sh" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          i = s.index('xcrun ar x "$out" compiler_rt.o')
          s = s[:i] + """xcrun ar x "$out"
          sort -u localize.txt >loc.txt
          for o in *.o; do
            chmod 644 "$o"
            xcrun nm -g "$o" | awk '$2 ~ /^[A-TV-Z]$/ {print $3}' | sort -u >all.txt
            if comm -12 all.txt loc.txt | grep -q .; then
              comm -23 all.txt loc.txt >keep.txt
              xcrun nmedit -s keep.txt "$o"
            fi
          done
          xcrun ar r "$out" *.o
          xcrun ranlib "$out" 2>/dev/null || true
          """
          open(p, 'w').write(s)
          PY
          git -C "$RUNNER_TEMP/ghostty" diff --stat
          echo "GHOSTTY_SOURCE_DIR=$RUNNER_TEMP/ghostty" >> "$GITHUB_ENV"
      - name: Exported libc symbols in the static library
        run: |
          cargo build -p libghostty-vt-sys
          for f in target/debug/build/libghostty-vt-sys-*/out/ghostty-install/lib/libghostty-vt.a; do
            echo "== $f"
            nm -gUA "$f" | grep -E " T _(memset|memcpy|memmove|memcmp|bcmp)$" || echo "none exported"
          done
      - name: tui_test
        run: cargo nextest run -p turbo --test tui_test --no-fail-fast
